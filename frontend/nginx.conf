server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS. Resolving per request (proxy_pass with a variable) keeps the proxy
    # working when the backend container is recreated with a new IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # REST + WebSocket API, same origin as the app (no CORS needed).
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        # Agent answers can take a while: several Nemotron calls plus Zetaris queries.
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass $backend;
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
