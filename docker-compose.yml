# AuraBI — database + Zetaris registration + backend + web app.
#
#   db (healthy) --> zetaris-setup (completed) --> backend (healthy) --> web
#
# Requires the Zetaris platform to be running on this machine: AuraBI joins its Docker
# network so Zetaris can read the bank database and the backend can query Zetaris.

name: aurabi

x-backend: &backend
  build: ./backend
  image: aurabi-backend:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-datapipe}:${POSTGRES_PASSWORD:-datapipe}@db:5432/${POSTGRES_DB:-datapipe}
  networks: [default, zetaris]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapipe}
      POSTGRES_DB: ${POSTGRES_DB:-datapipe}
      BANK_READER_USER: ${BANK_READER_USER:-zetaris_reader}
      BANK_READER_PASSWORD: ${BANK_READER_PASSWORD:?set BANK_READER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP only answers once the init scripts (schema + data) have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-datapipe} -d ${POSTGRES_DB:-datapipe}"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      default: {}
      zetaris:
        aliases: [aurabi-db]

  zetaris-setup:
    <<: *backend
    command: ["python", "-m", "app.cli.register_zetaris"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      zetaris-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # End-to-end check against the real services: docker compose run --rm verify
  verify:
    <<: *backend
    command: ["python", "-m", "app.cli.verify"]
    profiles: ["tools"]
    depends_on:
      backend:
        condition: service_healthy

  web:
    build: ./frontend
    image: aurabi-web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  zetaris:
    external: true
    name: ${ZETARIS_NETWORK:-zetaris_default}

volumes:
  pgdata:
