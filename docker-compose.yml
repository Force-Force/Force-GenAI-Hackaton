# AuraBI — the whole platform in one command:  docker compose up -d --build
#
#   Zetaris platform (included from ./zetaris-platform)      AuraBI
#   postgres -> driver -> api -> ui ------------------+
#                                                     v
#   db (bank data) ----------------------------> zetaris-setup -> backend -> web
#                                                                    |
#                                                                    +-> demo-seed
#
# zetaris-platform/ is the unzipped zetaris-platform.zip (not committed: proprietary).

name: aurabi

include:
  - path: ${ZETARIS_PLATFORM_DIR:-./zetaris-platform}/docker-compose.yml
    env_file: ${ZETARIS_PLATFORM_DIR:-./zetaris-platform}/.env

x-backend: &backend
  build: ./backend
  image: aurabi-backend:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-datapipe}:${POSTGRES_PASSWORD:-datapipe}@db:5432/${POSTGRES_DB:-datapipe}
    POSTGRES_USER: ${POSTGRES_USER:-datapipe}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapipe}
    POSTGRES_DB: ${POSTGRES_DB:-datapipe}
    BANK_READER_USER: ${BANK_READER_USER:-zetaris_reader}
    BANK_READER_PASSWORD: ${BANK_READER_PASSWORD:-aurabi_reader}
    # Zetaris services are reached by name on the shared network.
    ZETARIS_API_URL: ${ZETARIS_API_URL:-http://api:8888/api/v1.0}
    ZETARIS_AUTH_URL: ${ZETARIS_AUTH_URL:-http://ui:3000/api/auth/login}
    BANK_DB_HOST_FOR_ZETARIS: db
    # Admin account of the bundled Zetaris platform, read when ZETARIS_PASSWORD is not set.
    ZETARIS_PLATFORM_ENV: /run/zetaris-platform.env
  volumes:
    - ${ZETARIS_PLATFORM_DIR:-./zetaris-platform}/.env:/run/zetaris-platform.env:ro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapipe}
      POSTGRES_DB: ${POSTGRES_DB:-datapipe}
      BANK_READER_USER: ${BANK_READER_USER:-zetaris_reader}
      BANK_READER_PASSWORD: ${BANK_READER_PASSWORD:-aurabi_reader}
    ports:
      - "127.0.0.1:${AURABI_DB_PORT:-5433}:5432"
    volumes:
      - aurabi-pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP only answers once the init scripts (schema + data) have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-datapipe} -d ${POSTGRES_DB:-datapipe}"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Registers the bank database in Zetaris as AURABI_BANK, then exits.
  zetaris-setup:
    <<: *backend
    command: ["python", "-m", "app.cli.register_zetaris"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      ui:
        condition: service_healthy

  backend:
    <<: *backend
    volumes:
      - ${ZETARIS_PLATFORM_DIR:-./zetaris-platform}/.env:/run/zetaris-platform.env:ro
      # Meterless H-MEM agent memory (logs/meterless_memory.jsonl) survives restarts and updates.
      - aurabi-memory:/app/logs
    ports:
      - "127.0.0.1:${AURABI_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      zetaris-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the demo pipeline (canvas, history, a first AI conversation) on an empty install.
  demo-seed:
    <<: *backend
    command: ["python", "-m", "app.cli.seed_demo"]
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy

  web:
    build: ./frontend
    image: aurabi-web:local
    ports:
      - "${AURABI_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # End-to-end check against the real services:  docker compose run --rm verify
  verify:
    <<: *backend
    command: ["python", "-m", "app.cli.verify"]
    profiles: ["tools"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aurabi-pgdata:
  aurabi-memory:
